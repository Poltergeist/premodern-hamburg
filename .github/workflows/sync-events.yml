name: Sync events and decklists

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync events from TopDeck.gg
        run: npm run sync

      - name: Sync decklists from Google Sheets
        run: npm run sync:decklists
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/events.json src/data/decklists.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/decklists.json
          git commit -m "chore: sync events and decklists"
          git push

      - name: Trigger deploy
        if: steps.changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
